[build]
  publish = "dist/public"
  command = "pnpm install && pnpm exec playwright install chromium && pnpm run build:web"
  functions = "netlify/functions"

[build.processing]
  [build.processing.html]
    pretty_urls = true

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

# Canonical Brand Hub is /about — collapse legacy /brand-hub URLs
[[redirects]]
  from = "/brand-hub"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/brand-hub/"
  to = "/about"
  status = 301
  force = true

# Canonical host: no trailing slash (except home). Static shells cover real routes.
# Unknown paths return a real 404 instead of soft-404 SPA 200s.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
