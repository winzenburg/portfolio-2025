<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found | Ryan Winzenburg</title>
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/" />
  <link rel="canonical" href="https://winzenburg.com/" />
  <script>
    // SPA deep-link fallback for hosts that serve 404.html for unknown paths.
    // Preserve the requested path so the client router can render it.
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      try {
        sessionStorage.setItem("redirectPath", path);
      } catch (e) {
        // Ignore storage failures; redirect still works.
      }
      window.location.replace("/" + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    body {
      margin: 0;
      background: #020617;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <p>Redirecting… <a href="/">Go home</a></p>
</body>
</html>
