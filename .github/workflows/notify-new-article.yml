name: Notify Newsletter Subscribers

on:
  push:
    branches: [ main ]
    paths:
      - 'client/src/pages/Articles.tsx'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug to notify about (blank = newest article)'
        required: false
      dry_run:
        description: 'Preview only - do not actually send'
        type: boolean
        default: false
      force:
        description: 'Resend even if already logged as sent'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect newly-added articles
        if: github.event_name == 'push'
        id: detect
        run: |
          BASE_REF="${{ github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          NEW_ARTICLES=$(node scripts/detect-new-articles.js "$BASE_REF")
          if [ -z "$NEW_ARTICLES" ]; then
            echo "No new articles detected in this push (existing entries were just edited) - nothing to send."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NEW_ARTICLES" > /tmp/new-articles.jsonl
            echo "New articles detected:"
            cat /tmp/new-articles.jsonl
          fi

      - name: Install pnpm
        if: (github.event_name == 'push' && steps.detect.outputs.found == 'true') || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        if: (github.event_name == 'push' && steps.detect.outputs.found == 'true') || github.event_name == 'workflow_dispatch'
        run: pnpm install

      - name: Send notification
        if: (github.event_name == 'push' && steps.detect.outputs.found == 'true') || github.event_name == 'workflow_dispatch'
        env:
          NEWSLETTER_RESEND_API_KEY: ${{ secrets.NEWSLETTER_RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS=()
            if [ -n "${{ inputs.slug }}" ]; then ARGS+=(--slug "${{ inputs.slug }}"); fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
            node scripts/notify-subscribers.js "${ARGS[@]}"
          else
            while IFS= read -r article; do
              SLUG=$(node -e "console.log(JSON.parse(process.argv[1]).slug)" "$article")
              HERO=$(node -e "console.log(JSON.parse(process.argv[1]).heroImage)" "$article")
              HERO_URL="https://winzenburg.com${HERO}"

              echo "Waiting for $HERO_URL to go live (new deploy)..."
              READY=false
              for i in $(seq 1 40); do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HERO_URL" || echo "000")
                if [ "$STATUS" = "200" ]; then
                  echo "Live after $((i * 15))s."
                  READY=true
                  break
                fi
                sleep 15
              done

              if [ "$READY" != "true" ]; then
                echo "::warning::Timed out waiting for $HERO_URL to go live; sending notification anyway."
              fi

              echo "Notifying subscribers about: $SLUG"
              node scripts/notify-subscribers.js --slug "$SLUG"
            done < /tmp/new-articles.jsonl
          fi
