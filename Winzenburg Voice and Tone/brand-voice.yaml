# Brand Voice Guidelines for Winzenburg Content

author: "Ryan Winzenburg"
tagline: "Test the product bet before the build."

# Core Voice Identity

voice_personality: "Plain, direct practitioner"

audience: "Enterprise B2B product leaders (VP or Director of Product, Head of Design, CPO, and product-minded engineering leaders)"

elevator_pitch: |
  Before your team commits a quarter of engineering time, you should know the idea will hold up with real users. I help product leaders test the bet early, so the build starts on evidence instead of hope.

# Tone Framework

tone:
  primary: "direct-first-person"

  description: |
    Write in the first person, as Ryan. Lead with the reader's benefit, then the offer.
    Plain words. Short sentences are allowed to stand alone. No hype, no emoji, no em dashes,
    and no statistics that are not already on the site.

  characteristics:
    - "First person I. We only when Ryan and the client are both in the sentence."
    - "Benefit before the pitch. Name the decision the reader is about to fund."
    - "Concrete and specific. If a number is not already published, leave it out."
    - "Calm. No urgency tricks, no multipliers, no founder-hype."
    - "The consulting door has one label: Talk through your product bet."

# The Winzenburg Voice in Action

voice_principles:

  1_benefit_before_pitch:
    description: "The first sentence is the reader's job, not the product name or the price."
    examples:
      good:
        - "Before your team commits a quarter of engineering time, you should know the idea will hold up with real users. I help product leaders test the bet early, so the build starts on evidence instead of hope."
      avoid:
        - "Opening with a product name, a fee, or a duration before the reader knows what they get."
        - "Funnel language such as buyers, enter, and stay."

  2_first_person:
    description: "Ryan did the work. Say I."
    examples:
      good:
        - "I test the direction with your stakeholders and users, cut what does not hold up, and hand engineering a scope they can start."
      avoid:
        - "We put evidence under the direction."
        - "A team of specialists will handle this."

  3_no_hype:
    description: "State what happened. Do not inflate it."
    examples:
      good:
        - "I built the system in 4 weeks. It has 62 components and 826 type-safe icons."
      avoid:
        - "Force multiplier, unprecedented, AI-native, changed everything, blew my mind."
        - "Question headings. Ready to 3x your velocity?"

  4_no_invented_stats:
    description: "Do not invent a rate, a dollar figure, or a multiplier. If Ryan has not published the number, it does not go in the copy."
    examples:
      good:
        - "Use a number only when it is already on the page you are editing, and keep it in that context."
      avoid:
        - "Any new success rate, ROI multiple, or failure statistic added to make a line sound sharper."

  5_one_reader:
    description: "Enterprise B2B product leaders. Founder and builder pieces can stay in the archive, but the offer copy speaks to the person about to fund a build."
    examples:
      good:
        - "If your team is about to fund a direction and part of it is still a guess, tell me about it."
      avoid:
        - "Addressing VCs, gig boards, or a job search from a consulting page."

# Writing Style Mechanics

writing_style:

  sentence_structure:
    - "Mix short sentences with longer ones. Do not stack three parallel sentences."
    - "Active voice."
    - "One idea, then the next. Do not restate the intro at the end."

  punctuation:
    - "No em dashes. Use a period, a comma, or parentheses."
    - "No question marks in headings."
    - "Contractions are fine (it's, don't, you're)."

  words_to_avoid:
    - "delve, unpack, unlock, elevate, leverage, robust, seamless, holistic, game-changer, cutting-edge"
    - "not just X, but Y"
    - "isn't just X, it's Y"
    - "Here's the thing. Here's why."

# Tone Sample

tone_sample: |
  Before your team commits a quarter of engineering time, you should know the idea will hold up with real users. I help product leaders test the bet early, so the build starts on evidence instead of hope.

# Before Publishing

before_publishing_ask:
  - "Does the first sentence help the reader, before it names an offer?"
  - "Is this something Ryan would say out loud to one product leader?"
  - "Is every number already on the site?"
  - "Are there any em dashes?"
  - "Is the consulting link labeled Talk through your product bet?"
